<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MQS — أعمالنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0e0d0a;--ink:#f2efe6;--line:#272318;--mut:#938b78;--card:#161410;--soft:#201d14;--accent:oklch(0.78 0.12 82)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Tajawal",sans-serif;background:var(--bg);color:var(--ink);max-width:1280px;margin:0 auto;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  header{display:flex;align-items:center;justify-content:space-between;padding:28px 60px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:100}
  .logo{display:inline-flex;align-items:flex-end}
  nav{display:flex;gap:34px;font-weight:500;font-size:16px}
  nav a{color:var(--mut)}nav a:hover{color:var(--ink)}nav a.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:2px}
  .btn{background:var(--accent);color:var(--bg);font-weight:700;font-size:16px;padding:12px 28px;border:none;border-radius:40px;cursor:pointer;font-family:"Tajawal";display:inline-block}
  .ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink);font-family:"Tajawal";font-weight:700;font-size:16px;padding:11px 28px;border-radius:40px;cursor:pointer;display:inline-block}
  .phero{padding:80px 60px 60px;border-bottom:1px solid var(--line);text-align:center}
  .phero .lbl{color:var(--mut);font-weight:700;letter-spacing:2px;font-size:13px;margin-bottom:18px}
  .phero h1{font-size:72px;font-weight:900;letter-spacing:-1px}
  .phero p{font-size:20px;color:var(--mut);max-width:520px;margin:16px auto 0;line-height:1.7}
  /* filter tabs */
  .filters{padding:26px 60px;border-bottom:1px solid var(--line);display:flex;gap:12px}
  .tag{border:1.5px solid var(--line);color:var(--mut);font-weight:700;font-size:14px;padding:8px 20px;border-radius:40px;cursor:pointer;background:transparent;font-family:"Tajawal"}
  .tag.on{border-color:var(--accent);background:var(--accent);color:var(--bg)}
  /* masonry-style grid */
  .gallery{padding:52px 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .gitem{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);position:relative;cursor:pointer;transition:.15s}
  .gitem:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.1)}
  .gitem .ph .icon{font-size:60px;color:var(--mut)}
  .gitem .ph .label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.5));color:#fff;padding:20px 18px 16px;font-weight:700;font-size:16px}
  .gitem .ph .barber{position:absolute;top:14px;right:14px;background:var(--accent);color:var(--bg);font-weight:700;font-size:12px;padding:5px 12px;border-radius:30px}
  .gitem .ph.h280{height:280px}.gitem .ph.h380{height:380px}.gitem .ph.h200{height:200px}
  .gitem .info{padding:18px 20px}
  .gitem .info h3{font-size:19px;font-weight:900}
  .gitem .info small{color:var(--mut);font-size:13px;display:block;margin-top:3px}
  .gitem .info .bk{margin-top:14px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);font-family:"Tajawal";font-weight:700;font-size:14px;padding:8px 22px;border-radius:40px;cursor:pointer;display:inline-block}
  .gitem .info .bk:hover{background:var(--accent);color:var(--bg)}
  /* before-after */
  .ba-section{padding:60px 60px;border-top:1px solid var(--line)}
  .ba-section h2{font-size:44px;font-weight:900;margin-bottom:8px}
  .ba-section .sub{color:var(--mut);font-size:17px;margin-bottom:36px}
  .ba-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
  .ba-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
  .ba-card .imgs{display:grid;grid-template-columns:1fr 1fr}
  .ba-card .side{display:flex;flex-direction:column}
  .ba-card .side .ph{flex:1;height:220px;background:linear-gradient(150deg,#201d14,#161410);display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--mut);position:relative}
  .ba-card .side .cap{background:var(--soft);text-align:center;font-weight:700;font-size:13px;color:var(--mut);padding:10px;letter-spacing:1px}
  .ba-card .side:first-child .cap{background:var(--accent);color:var(--bg)}
  .ba-card .divider{width:3px;background:var(--bg)}
  .ba-card .foot{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}
  .ba-card .foot h3{font-size:18px;font-weight:900}
  .ba-card .foot small{color:var(--mut);font-size:13px}
  /* cta */
  .cta-band{padding:80px 60px;text-align:center;border-top:1px solid var(--line)}
  .cta-band h2{font-size:52px;font-weight:900;letter-spacing:-1px}
  .cta-band p{color:var(--mut);font-size:18px;margin:16px 0 30px}
  footer{padding:40px 60px;border-top:1px solid var(--line);text-align:center}
  .foot-links{display:flex;justify-content:center;gap:28px;color:var(--mut);font-size:15px}
  .foot-links a{color:var(--mut)}

  /* SVG icon sizing overrides */
  .sv .icon svg{width:32px;height:32px;stroke:var(--ink)}
  .bc .av svg{width:38px;height:38px;stroke:var(--mut)}
  .bc .ph svg{width:48px;height:48px;stroke:var(--mut)}
  .note .icon svg{width:22px;height:22px;stroke:var(--mut)}
  .detail .icon svg{width:28px;height:28px;stroke:var(--ink)}
  .stars-svg svg{width:15px;height:15px;fill:var(--ink);vertical-align:middle;margin-left:1px}
  .rv .stars-svg svg{fill:var(--ink)}
  .bc .rating .stars-svg svg{fill:var(--ink)}

  .ph-label{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--soft)}
  .ph-barber{font-weight:900;font-size:15px}
  .ph-cat{color:var(--mut);font-size:14px;font-weight:700}
  .gitem.tall{grid-row:span 1}
.ba-ph{height:120px;background:var(--soft);border-bottom:1px solid var(--line)}
  /* responsive */
  @media (max-width: 820px) {
    header{padding:16px 20px;flex-wrap:wrap;gap:12px}
    nav{order:3;width:100%;justify-content:center;flex-wrap:wrap;gap:16px;font-size:15px}
    .phero{padding:50px 20px 40px}
    .phero h1{font-size:44px}
    .phero p{font-size:18px}
    .filters{padding:18px 20px;flex-wrap:wrap}
    .gallery{padding:32px 20px;grid-template-columns:1fr}
    .ba-section{padding:40px 20px}
    .ba-section h2{font-size:32px}
    .ba-grid{grid-template-columns:1fr}
    .cta-band{padding:50px 20px}
    .cta-band h2{font-size:34px}
    footer{padding:40px 20px}
    .foot-links{flex-wrap:wrap;gap:16px}
  }
  @media (max-width: 480px) {
    .phero{padding:42px 18px 34px}
    .phero h1{font-size:34px}
    .phero p{font-size:16px}
    .cta-band h2{font-size:28px}
  }
</style>
</head>
<body>
  <header>
    <a href="index.html" class="logo" style="display:inline-flex;align-items:flex-end;line-height:1"><svg width="140" height="46" viewBox="0 0 140 46" fill="none" xmlns="http://www.w3.org/2000/svg" style="direction:ltr"><text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#f2efe6" letter-spacing="4">MQS</text><line x1="0" y1="38" x2="140" y2="38" stroke="#f2efe6" stroke-width="1.5"/><text x="1" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="8" fill="#938b78" letter-spacing="7">BARBER</text></svg></a>
    <nav>
      <a href="services.html">الخدمات</a>
      <a href="team.html">الحلاقين</a>
      <a href="gallery.html" class="active">أعمالنا</a>
      <a href="hours.html">الدوام</a>
    </nav>
</header>

  <div class="phero">
    <div class="lbl">أعمالنا</div>
    <h1>الشغل يتكلم</h1>
    <p>نماذج من أعمال حلاقينا — كل قصّة لها ستايلها.</p>
  </div>

  <div class="cta-band">
    <h2>دورك الجاي</h2>
    <p>احجز كرسيك الحين وخلّ شغلنا يتكلم عنك.</p>
    <a href="booking.html" class="btn">احجز موعدك</a>
  </div>


<footer>
    <div class="foot-links">
      <a href="index.html">الرئيسية</a>
      <a href="services.html">الخدمات</a>
      <a href="team.html">الحلاقين</a>
      <a href="hours.html">الدوام</a>
      <a href="booking.html">احجز</a>
    </div>
  </footer>

</body>
</html>
